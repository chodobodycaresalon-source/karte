<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#8c5e5a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>ちょうど カルテ</title>
<style>
:root{--bg:#faf7f5;--card:#fff;--ink:#2b2523;--muted:#7a6f6b;--accent:#8c5e5a;--accent-weak:#f6ecea;--line:#e8dedb;--warn:#b42318;--chip:#f3eeec;--note:#fff8e6;--note-line:#efd9a6}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:17px;line-height:1.6}
button,.btn{font:inherit;font-size:16px;min-height:46px;padding:8px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;margin:0}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button.danger{color:var(--warn);border-color:#f3c7c2}
button.big{min-width:180px;min-height:56px;font-size:18px}
button:active,.btn:active{transform:translateY(1px)}
input,textarea,select{font:inherit;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
textarea{resize:vertical}
label.f{display:block;margin:10px 0 4px;font-size:15px;color:var(--muted)}
label.f>input,label.f>select,label.f>textarea{margin-top:4px;color:var(--ink)}
h1,h2,h3,h4{margin:0 0 8px;line-height:1.3}
h2{font-size:22px}h3{font-size:19px;margin-top:22px}h4{font-size:17px}
small,.muted{color:var(--muted);font-size:14px}
.err{color:var(--warn);min-height:1.5em}
header{position:sticky;top:0;z-index:5;background:var(--accent);color:#fff;display:flex;align-items:center;gap:8px;padding:8px 16px;flex-wrap:wrap}
header .t{font-weight:700;margin-right:auto}
header button{background:transparent;color:#fff;border-color:rgba(255,255,255,.45);min-height:42px}
header button.on{background:rgba(255,255,255,.22)}
main{max-width:1100px;margin:0 auto;padding:16px}
main.withbar{padding-bottom:110px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.click{cursor:pointer}.click:active{background:var(--chip)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.center{justify-content:center}
.grow{flex:1;min-width:160px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:42px;padding:6px 14px;border-radius:999px;background:var(--chip);border:1px solid var(--line)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.mini{min-height:0;padding:1px 10px;font-size:13px}
.pain .chip{min-width:48px;padding:6px 8px}
.tagcat{margin:8px 0}
.tagcat>div:first-child{font-size:14px;color:var(--muted);margin-bottom:4px}
.carry{background:var(--note);border-color:var(--note-line)}
.carry dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:4px 18px;margin:6px 0 0}
.carry dt{font-weight:700;font-size:15px;color:#7a5a1f;margin-top:6px}
.carry dd{margin:0;white-space:pre-wrap}
.carry ul{margin:0;padding-left:1.2em}
.advcol{background:var(--accent-weak);border-radius:12px;padding:12px}
.sub{font-size:13px;color:var(--muted);margin:10px 0 4px;font-weight:700}
.adopted{display:flex;gap:6px;margin-bottom:6px}
.adopted button{min-height:44px;padding:0 12px}
.cand{display:flex;width:100%;justify-content:space-between;margin-bottom:6px;border-style:dashed;text-align:left}
.cand small{white-space:nowrap;margin-left:8px}
.chartwrap{position:relative;max-width:440px;margin:6px auto 8px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.chartwrap img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
.chartwrap canvas{position:absolute;left:0;top:0;touch-action:none}
.phase{background:var(--chip);border-radius:12px;padding:10px;margin-top:10px}
.dirs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
@media (max-width:560px){.dirs{grid-template-columns:repeat(2,1fr)}}
.slot{cursor:pointer;text-align:center}
.sl{font-weight:600;font-size:15px}
.ph{position:relative;background:#e9e4e2;border-radius:8px;overflow:hidden;aspect-ratio:3/4;display:flex;align-items:center;justify-content:center}
.ph img{width:100%;height:100%;object-fit:contain;display:block}
.ph.big{aspect-ratio:auto;max-height:70vh}
.ph.big img{height:auto;max-height:70vh}
.gridov{position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(to right,rgba(0,190,255,.5) 1px,transparent 1px),linear-gradient(to bottom,rgba(0,190,255,.5) 1px,transparent 1px);background-size:10% 10%}
.gridov::after{content:"";position:absolute;top:0;bottom:0;left:50%;border-left:2px solid rgba(255,50,50,.85)}
body.nogrid .ph .gridov{display:none}
.vitem{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--chip);border-radius:10px;padding:8px;margin-top:8px}
.vitem select{width:auto}
.vitem input{flex:1;min-width:140px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:20;display:none;align-items:center;justify-content:center;padding:10px}
#modal.open{display:flex}
#modal .box{background:var(--card);border-radius:14px;padding:14px;max-width:1100px;width:100%;max-height:96vh;overflow:auto}
.cam{position:relative;margin:8px auto;background:#000;max-height:74vh}
.cam video{display:block;width:100%;height:100%;object-fit:contain}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
.rectime{font-size:22px;font-weight:700;min-width:70px;text-align:center}
.cmp{display:grid;grid-template-columns:110px repeat(4,1fr);gap:6px;align-items:center}
.cmp .h{text-align:center;font-weight:700}
.cmp .rl{font-weight:700;font-size:14px}
.cmp .ph{aspect-ratio:auto;height:min(38vh,46vw)}
.lock{max-width:380px;margin:12vh auto;text-align:center;padding:0 16px}
.lock input{text-align:center;font-size:26px;letter-spacing:.3em;margin-bottom:10px}
.lock button{width:100%}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.savebar .row{max-width:1100px;margin:0 auto}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30;max-width:90vw;text-align:center}
#toast.show{opacity:1}
.banner{background:var(--note);border:1px solid var(--note-line);border-radius:10px;padding:8px 12px;font-size:15px;margin-bottom:12px}
.badge{display:inline-block;background:var(--warn);color:#fff;border-radius:6px;padding:0 8px;font-size:13px}
.painv{font-weight:700;color:var(--accent)}
</style>
</head>

/* ================= 暗号化（PINから鍵を作り、AES-GCMで全データを暗号化） ================= */
const enc = new TextEncoder(), dec = new TextDecoder();
let KEY = null;
async function deriveKey(pin, salt){
  const base = await crypto.subtle.importKey('raw', enc.encode(pin), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:310000, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
async function encBuf(buf){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  return {iv, ct: await crypto.subtle.encrypt({name:'AES-GCM', iv}, KEY, buf)};
}
const decBuf = e => crypto.subtle.decrypt({name:'AES-GCM', iv:e.iv}, KEY, e.ct);
const encObj = o => encBuf(enc.encode(JSON.stringify(o)));
const decObj = async e => JSON.parse(dec.decode(await decBuf(e)));

/* ================= 端末内データベース（IndexedDB） ================= */
let DB;
function openDB(){ return new Promise((res, rej) => { const r = indexedDB.open(APP_DB, 1);
  r.onupgradeneeded = () => { r.result.createObjectStore('meta'); r.result.createObjectStore('data'); };
  r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
function tx(store, mode, fn){ return new Promise((res, rej) => { const t = DB.transaction(store, mode); const r = fn(t.objectStore(store)); let out;
  if (r) r.onsuccess = () => out = r.result; t.oncomplete = () => res(out); t.onerror = () => rej(t.error); }); }
const metaGet = k => tx('meta', 'readonly', s => s.get(k));
const metaSet = (k, v) => tx('meta', 'readwrite', s => s.put(v, k));
const dataPut = async (k, o) => { const e = await encObj(o); return tx('data', 'readwrite', s => s.put(e, k)); };
const dataGet = async k => { const e = await tx('data', 'readonly', s => s.get(k)); return e ? decObj(e) : null; };
const dataDel = k => tx('data', 'readwrite', s => s.delete(k));
async function mediaPut(id, blob){ const e = await encBuf(await blob.arrayBuffer()); e.type = blob.type; e.bin = 1; return tx('data', 'readwrite', s => s.put(e, 'm:' + id)); }
const URLC = {};   // 復号した写真・動画の表示用URL（ロック時に破棄）
async function mediaURL(id){
  if (!id) return null; if (URLC[id]) return URLC[id];
  const e = await tx('data', 'readonly', s => s.get('m:' + id)); if (!e) return null;
  return URLC[id] = URL.createObjectURL(new Blob([await decBuf(e)], {type:e.type}));
}
async function mediaDel(id){ await dataDel('m:' + id); if (URLC[id]) { URL.revokeObjectURL(URLC[id]); delete URLC[id]; } }

/* ================= 状態 ================= */
let S = {patients:{}, visits:{}, cfg:null};
let view = {name:'list'};
let F = null;            // 編集中のカルテ
let RESUME = null;       // 自動ロック時に下書き保存したカルテ
let fails = 0, waitUntil = 0, locking = false;

/* ================= ロック ================= */
async function renderLock(){
  const has = await metaGet('salt');
  $('#app').innerHTML = `<div class="lock"><h1>ちょうど カルテ</h1>
    ${has ? `<p>PINを入力してください</p><input id="pin" type="password" inputmode="numeric" autocomplete="off">
      <button class="primary" onclick="unlock()">開く</button>`
    : `<p>初回設定：PIN（6〜12桁の数字）を決めてください。<br><small>PINを忘れるとデータは誰にも開けません（復旧できません）。紙に書いて安全な場所に保管してください。</small></p>
      <input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN">
      <input id="pin2" type="password" inputmode="numeric" autocomplete="off" placeholder="確認のためもう一度">
      <button class="primary" onclick="setupPin()">設定する</button>`}
    <p id="err" class="err"></p></div>`;
  $('#pin').focus();
  document.querySelectorAll('.lock input').forEach(i => i.onkeydown = e => { if (e.key === 'Enter') (has ? unlock : setupPin)(); });
}
async function setupPin(){
  const a = $('#pin').value, b = $('#pin2').value;
  if (!/^\d{6,12}$/.test(a)) return $('#err').textContent = 'PINは6〜12桁の数字にしてください';
  if (a !== b) return $('#err').textContent = '2回の入力が一致しません';
  const salt = crypto.getRandomValues(new Uint8Array(16));
  KEY = await deriveKey(a, salt);
  await metaSet('salt', salt);
  await metaSet('check', await encObj({ok:1}));
  await dataPut('cfg', structuredClone(DEFAULT_CFG));
  await afterUnlock();
}
async function unlock(){
  if (Date.now() < waitUntil) return $('#err').textContent = `しばらくお待ちください（${Math.ceil((waitUntil - Date.now()) / 1000)}秒）`;
  const pin = $('#pin').value; $('#err').textContent = '確認中…';
  try { KEY = await deriveKey(pin, await metaGet('salt')); await decObj(await metaGet('check')); }
  catch (e) { KEY = null; fails++; $('#pin').value = ''; if (fails >= 5) waitUntil = Date.now() + 30000 * (fails - 4); return $('#err').textContent = 'PINが違います'; }
  fails = 0; await afterUnlock();
}
async function afterUnlock(){
  S = {patients:{}, visits:{}, cfg:null};
  const keys = await tx('data', 'readonly', s => s.getAllKeys());
  for (const k of keys) {
    if (k === 'cfg') S.cfg = await dataGet(k);
    else if (k.startsWith('p:')) { const p = await dataGet(k); S.patients[p.id] = p; }
    else if (k.startsWith('v:')) { const v = await dataGet(k); S.visits[v.id] = v; }
  }
  S.cfg = Object.assign(structuredClone(DEFAULT_CFG), S.cfg || {});
  S.lastBackup = await metaGet('lastBackup');
  try { navigator.storage?.persist?.(); } catch (e) {}
  resetIdle();
  if (RESUME && S.visits[RESUME]) { const id = RESUME; RESUME = null; openVisit(id); toast('ロック前の入力を下書きから復元しました'); }
  else go('list');
}
async function lock(){
  if (locking) return; locking = true;
  try { if (KEY && view.name === 'visit' && F && F.dirty) { await saveVisit({draft:true, silent:true}); RESUME = F.id; } }
  catch (e) { console.error(e); }
  closeModal();
  if (F) for (const u of Object.values(F.newUrls || {})) URL.revokeObjectURL(u);
  for (const k in URLC) { URL.revokeObjectURL(URLC[k]); delete URLC[k]; }
  KEY = null; S = {patients:{}, visits:{}, cfg:null}; F = null; view = {name:'list'};
  locking = false; renderLock();
}
let idleT;
function resetIdle(){ clearTimeout(idleT); if (KEY) idleT = setTimeout(() => { if (!rec) lock(); else resetIdle(); }, (S.cfg?.lockMin || 5) * 60000); }
['pointerdown','keydown','touchstart'].forEach(ev => document.addEventListener(ev, resetIdle, {passive:true}));
document.addEventListener('input', () => { if (view.name === 'visit' && F) F.dirty = true; });

/* ================= 画面遷移 ================= */
function go(name, params = {}){
  if (view.name === 'visit' && name !== 'visit' && F && F.dirty && !confirm('保存していない入力があります。破棄して移動しますか？')) return;
  if (view.name === 'visit' && name !== 'visit' && F) { for (const u of Object.values(F.newUrls || {})) URL.revokeObjectURL(u); F = null; }
  view = Object.assign({name}, params); render(); window.scrollTo(0, 0);
}
function render(){
  if (!KEY) return renderLock();
  const on = n => (view.name === n || (n === 'list' && ['patient','pform','visit'].includes(view.name))) ? 'on' : '';
  const body = {list:vList, pform:vPForm, patient:vPatient, visit:vVisit, settings:vSettings}[view.name]();
  $('#app').innerHTML = `<header><span class="t">${esc(S.cfg.shopName)}</span>
    <button class="${on('list')}" onclick="go('list')">患者一覧</button>
    <button class="${on('settings')}" onclick="go('settings')">設定</button>
    <button onclick="lock()">🔒 ロック</button></header><main class="${view.name === 'visit' ? 'withbar' : ''}">${body}</main>`;
  if (view.name === 'visit') { loadSlots(); initChart(); renderVideos(); }
  if (view.name === 'settings') showUsage();
}
const visitsOf = pid => Object.values(S.visits).filter(v => v.pid === pid).sort((a, b) => (b.date + b.created).localeCompare(a.date + a.created));

  return `<div class="grid2">${ps.map(p => { const vs = visitsOf(p.id); const last = vs[0];

/* ================= 人体図 ================= */
let curStroke = null;
function initChart(){
  const cv = $('#chartcv'), img = $('#bodyimg'); if (!cv) return;
  const fit = () => { const r = img.getBoundingClientRect(), dpr = devicePixelRatio || 1;
    cv.width = r.width * dpr; cv.height = r.height * dpr; cv.style.width = r.width + 'px'; cv.style.height = r.height + 'px'; drawChart(); };
  if (img.complete) fit(); else img.onload = fit;
  window.onresize = () => { if ($('#chartcv')) fit(); };
  const pt = e => { const r = cv.getBoundingClientRect(); return [+((e.clientX - r.left) / r.width).toFixed(4), +((e.clientY - r.top) / r.height).toFixed(4)]; };
  cv.onpointerdown = e => { cv.setPointerCapture(e.pointerId); curStroke = [pt(e)]; F.chart.push(curStroke); F.dirty = true; drawChart(); };
  cv.onpointermove = e => { if (!curStroke) return; const q = pt(e), l = curStroke[curStroke.length - 1];
    if (Math.hypot(q[0] - l[0], q[1] - l[1]) > 0.004) { curStroke.push(q); drawChart(); } };
  cv.onpointerup = cv.onpointercancel = () => curStroke = null;
}
function drawChart(){
  const cv = $('#chartcv'); if (!cv) return; const c = cv.getContext('2d');
  c.clearRect(0, 0, cv.width, cv.height);
  c.strokeStyle = 'rgba(215,30,30,.85)'; c.lineWidth = Math.max(3, cv.width / 140); c.lineCap = c.lineJoin = 'round';
  for (const s of F.chart) { c.beginPath();
    s.forEach(([x, y], i) => i ? c.lineTo(x * cv.width, y * cv.height) : c.moveTo(x * cv.width, y * cv.height));
    if (s.length === 1) c.lineTo(s[0][0] * cv.width + 0.5, s[0][1] * cv.height); c.stroke(); }
}
function chartUndo(){ F.chart.pop(); F.dirty = true; drawChart(); }
function chartClear(){ if (F.chart.length && confirm('人体図の印をすべて消しますか？')) { F.chart = []; F.dirty = true; drawChart(); } }

/* ================= 写真 ================= */
async function slotURL(key){ return F.newUrls[key] || await mediaURL(F.media[key]); }
const photoTag = src => `<img src="${src}" alt=""><div class="gridov"></div>`;
async function loadSlot(key){ const el = $('#ph_' + key); if (!el) return; const u = await slotURL(key); el.innerHTML = u ? photoTag(u) : '<span class="muted">未撮影</span>'; }
function loadSlots(){ for (const [p] of PHASES) for (const [d] of DIRS) loadSlot(p + '_' + d); }
function toJpeg(srcEl, w, h){
  const m = 1600, r = Math.min(1, m / Math.max(w, h));
  const c = document.createElement('canvas'); c.width = Math.round(w * r); c.height = Math.round(h * r);
  c.getContext('2d').drawImage(srcEl, 0, 0, c.width, c.height);
  return new Promise(res => c.toBlob(res, 'image/jpeg', 0.85));
}
function fileToJpeg(f){
  return new Promise((res, rej) => { const u = URL.createObjectURL(f), img = new Image();
    img.onload = async () => { const b = await toJpeg(img, img.naturalWidth, img.naturalHeight); URL.revokeObjectURL(u); res(b); };
    img.onerror = () => { URL.revokeObjectURL(u); rej(new Error('画像を読み込めません')); }; img.src = u; });
}
function setSlot(key, blob){
  if (F.newUrls[key]) URL.revokeObjectURL(F.newUrls[key]);
  F.newMedia[key] = blob; F.newUrls[key] = URL.createObjectURL(blob); F.dirty = true; loadSlot(key);
}
async function pickMany(ph, inp){
  const fs = [...inp.files].sort((a, b) => a.lastModified - b.lastModified); inp.value = '';
  if (fs.length > 4) toast('先頭の4枚だけ使います（撮影時刻の順）');
  for (let i = 0; i < Math.min(4, fs.length); i++) setSlot(ph + '_' + DIRS[i][0], await fileToJpeg(fs[i]));
  if (fs.length) toast('撮影時刻の順に 正面→右→背面→左 で入れました。違う場合は写真をタップして直せます');
}
async function pickOne(key, inp){ const f = inp.files[0]; inp.value = ''; if (!f) return; setSlot(key, await fileToJpeg(f)); closeModal(); }
async function slotMenu(key){
  const u = await slotURL(key); const [ph, d] = key.split('_'); const idx = DIRS.findIndex(x => x[0] === d);
  openModal(`<div class="row"><h3 class="grow" style="margin:0">${slotLabel(key)}</h3><button onclick="closeModal()">閉じる</button></div>
    ${u ? `<div class="ph big" style="margin:10px 0">${photoTag(u)}</div>` : '<p class="muted">まだ撮影していません</p>'}
    <div class="row center"><button class="primary" onclick="closeModal();startCam('${ph}',${idx},false)">📷 ${u ? '撮り直す' : '撮影する'}</button>
    ${fileInput('画像を選ぶ', `accept="image/*" onchange="pickOne('${key}',this)"`)}
    ${u ? `<button class="danger" onclick="delSlot('${key}')">この写真を削除</button>` : ''}</div>`);
}
function delSlot(key){
  if (!confirm('この写真を削除しますか？（保存すると確定します）')) return;
  if (F.newMedia[key]) { URL.revokeObjectURL(F.newUrls[key]); delete F.newMedia[key]; delete F.newUrls[key]; }
  else if (F.media[key]) { F.delMedia.push(F.media[key]); delete F.media[key]; }
  F.dirty = true; closeModal(); loadSlot(key);
}

/* ================= カメラ ================= */
let stream = null, facing = 'environment', camState = null;
function stopCamera(){ if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; } }
async function getCam(w, h){
  stopCamera();
  stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing}, width:{ideal:w}, height:{ideal:h}}, audio:false});
  const v = $('#vid'); if (v) attach(v);
}
function attach(v){
  v.srcObject = stream;
  v.onloadedmetadata = () => { const w = $('#camwrap'), ar = v.videoWidth / v.videoHeight; w.style.aspectRatio = ar; w.style.width = `min(100%, calc(74vh * ${ar}))`; };
}
const camBox = (label, buttons) => `<div class="row"><b class="grow" id="camlabel">${label}</b><button onclick="closeModal()">閉じる</button></div>
  <div class="cam" id="camwrap"><video id="vid" autoplay playsinline muted></video><div class="gridov"></div><div class="flash" id="flash"></div></div>
  <div class="row center">${buttons}<button id="flipbtn" onclick="flipCam()">カメラ切替</button></div>`;
async function startCam(ph, idx, seq){
  camState = {ph, idx, seq};
  openModal(camBox('', `<button class="primary big" onclick="snap()">● 撮影</button>`)); camLabel();
  try { await getCam(1920, 1920); } catch (e) { closeModal(); toast('カメラを起動できません。「画像を選ぶ」をお使いください'); }
}
function camLabel(){ const {ph, idx, seq} = camState; $('#camlabel').textContent = `${slotLabel(ph + '_' + DIRS[idx][0])}${seq ? `（${idx + 1}/4）` : ''}　赤線を体の中心に合わせてください`; }
async function flipCam(){ facing = facing === 'environment' ? 'user' : 'environment'; try { await getCam(1920, 1920); } catch (e) { toast('切り替えできませんでした'); } }
async function snap(){
  const v = $('#vid'); if (!v || !v.videoWidth) return;
  const fl = $('#flash'); fl.style.opacity = .8; setTimeout(() => fl && (fl.style.opacity = 0), 120);
  const b = await toJpeg(v, v.videoWidth, v.videoHeight); const {ph, idx, seq} = camState;
  setSlot(ph + '_' + DIRS[idx][0], b);
  if (seq && idx < 3) { camState.idx++; camLabel(); } else { closeModal(); toast(seq ? '4方向を撮影しました（保存で確定）' : '写真を追加しました（保存で確定）'); }
}

/* ================= 動画 ================= */
let rec = null, recTimer = null;
function stopRec(){ clearInterval(recTimer); if (rec && rec.state === 'recording') { rec.onstop = null; rec.stop(); } rec = null; }
async function startVideo(ph){
  openModal(camBox(`動画（${phaseLabel(ph)}） 最長${MAX_VIDEO_SEC}秒`, `<button class="primary big" id="recbtn" onclick="toggleRec('${ph}')">● 録画開始</button><span class="rectime" id="rectime">0秒</span>`));
  try { await getCam(1280, 720); } catch (e) { closeModal(); toast('カメラを起動できません。「動画を選ぶ」をお使いください'); }
}
function toggleRec(ph){
  if (rec) { rec.stop(); return; }
  if (!stream) return;
  const mt = ['video/mp4', 'video/webm;codecs=vp9', 'video/webm'].find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t));
  const chunks = [], t0 = Date.now();
  rec = new MediaRecorder(stream, mt ? {mimeType:mt, videoBitsPerSecond:2500000} : {videoBitsPerSecond:2500000});
  rec.ondataavailable = e => e.data.size && chunks.push(e.data);
  rec.onstop = () => {
    const type = (rec.mimeType || mt || 'video/webm').split(';')[0], dur = Math.min(MAX_VIDEO_SEC, Math.round((Date.now() - t0) / 1000));
    rec = null; addVideo(new Blob(chunks, {type}), ph, dur); closeModal(); toast('動画を追加しました（保存で確定）');
  };
  rec.start(1000); $('#recbtn').textContent = '■ 停止'; $('#flipbtn')?.remove();
  recTimer = setInterval(() => { const s = Math.floor((Date.now() - t0) / 1000); const el = $('#rectime'); if (el) el.textContent = s + '秒';
    if (s >= MAX_VIDEO_SEC && rec && rec.state === 'recording') rec.stop(); }, 250);
}
function addVideo(blob, ph, dur){
  const id = uid(); F.videos.push({id, phase:ph, dur, type:blob.type, memo:''}); F.newVideos[id] = blob;
  F.newUrls['v' + id] = URL.createObjectURL(blob); F.dirty = true; renderVideos();
}
function pickVideo(inp){
  const f = inp.files[0]; inp.value = ''; if (!f) return;
  if (f.size > 60e6) return toast('動画が大きすぎます（60MBまで）。30秒以内の動画を選んでください');
  const v = document.createElement('video'); v.preload = 'metadata'; const u = URL.createObjectURL(f);
  v.onloadedmetadata = () => { URL.revokeObjectURL(u); addVideo(f, 'pre', Math.round(v.duration) || null); toast('動画を追加しました。施術前/後を選んでください'); };
  v.onerror = () => { URL.revokeObjectURL(u); addVideo(f, 'pre', null); };
  v.src = u;
}
const videoURL = async id => F.newUrls['v' + id] || await mediaURL(id);
function renderVideos(){
  const el = $('#vlist'); if (!el) return;
  el.innerHTML = F.videos.length ? F.videos.map((v, i) => `<div class="vitem">
    <select onchange="F.videos[${i}].phase=this.value;F.dirty=true">${PHASES.map(([p, l]) => `<option value="${p}" ${v.phase === p ? 'selected' : ''}>${l}</option>`).join('')}</select>
    <small>${v.dur ? v.dur + '秒' : ''}</small><input placeholder="メモ（例：歩行・前屈）" value="${esc(v.memo)}" oninput="F.videos[${i}].memo=this.value">
    <button onclick="playVideo('${v.id}')">▶ 再生</button><button class="danger" onclick="delVideo(${i})">削除</button></div>`).join('')
    + (F.videos.length > 1 ? `<div class="row" style="margin-top:8px"><button onclick="sideBySide()">▶▶ 2本を並べて再生</button></div>` : '')
    : '<p class="muted" style="margin:6px 0 0">動画はありません</p>';
}
async function playVideo(id){
  openModal(`<div class="row"><b class="grow">動画</b><button onclick="closeModal()">閉じる</button></div>
    <video src="${await videoURL(id)}" controls autoplay playsinline style="width:100%;max-height:78vh;background:#000;margin-top:8px"></video>`);
}
function delVideo(i){
  if (!confirm('この動画を削除しますか？（保存すると確定します）')) return;
  const v = F.videos.splice(i, 1)[0];
  if (F.newVideos[v.id]) { delete F.newVideos[v.id]; URL.revokeObjectURL(F.newUrls['v' + v.id]); delete F.newUrls['v' + v.id]; }
  else F.delMedia.push(v.id);
  F.dirty = true; renderVideos();
}
function sideBySide(){
  const opt = sel => F.videos.map((v, i) => `<option value="${v.id}" ${i === sel ? 'selected' : ''}>${phaseLabel(v.phase)} ${esc(v.memo)} ${v.dur ? v.dur + '秒' : ''}</option>`).join('');
  const a = Math.max(0, F.videos.findIndex(v => v.phase === 'pre')), b0 = F.videos.findIndex((v, i) => v.phase === 'post' && i !== a);
  const b = b0 >= 0 ? b0 : (a === 0 ? 1 : 0);
  openModal(`<div class="row"><b class="grow">並べて再生</b><button class="primary" onclick="playBoth()">▶ 同時に再生</button><button onclick="closeModal()">閉じる</button></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px">
    ${[a, b].map((s, n) => `<div><select onchange="setSbs(${n},this.value)">${opt(s)}</select><video id="sbs${n}" controls playsinline muted style="width:100%;max-height:66vh;background:#000;margin-top:6px"></video></div>`).join('')}</div>`);
  setSbs(0, F.videos[a].id); setSbs(1, F.videos[b].id);
}
async function setSbs(n, id){ const v = $('#sbs' + n); if (v) v.src = await videoURL(id); }
function playBoth(){ for (const n of [0, 1]) { const v = $('#sbs' + n); v.currentTime = 0; v.play(); } }

/* ================= 写真の比較 ================= */
function cmpSources(){
  const prev = F.prevId && S.visits[F.prevId]; const out = [];
  for (const [ph, pl] of PHASES) out.push({key:'cur_' + ph, label:`今回 ${pl}`, date:F.date, url:d => slotURL(ph + '_' + d)});
  if (prev) for (const [ph, pl] of PHASES) out.push({key:'prev_' + ph, label:`前回 ${pl}`, date:prev.date, url:d => mediaURL((prev.media || {})[ph + '_' + d])});
  return out;
}
let cmpSel = null;
async function openCompare(){
  const src = cmpSources(); const has = async s => { for (const [d] of DIRS) if (await s.url(d)) return true; return false; };
  const avail = []; for (const s of src) if (await has(s)) avail.push(s.key);
  if (!avail.length) return toast('比較できる写真がまだありません');
  cmpSel = avail.includes('cur_pre') && avail.includes('cur_post') ? ['cur_pre', 'cur_post']
    : avail.includes('prev_pre') && avail.includes('cur_pre') ? ['prev_pre', 'cur_pre'] : [avail[0], avail[1] || avail[0]];
  const opt = n => src.map(s => `<option value="${s.key}" ${cmpSel[n] === s.key ? 'selected' : ''}>${s.label}（${fmtDate(s.date)}）${avail.includes(s.key) ? '' : ' ※写真なし'}</option>`).join('');
  openModal(`<div class="row"><h3 class="grow" style="margin:0">写真の比較</h3><button onclick="document.body.classList.toggle('nogrid')">グリッド</button>
    <button onclick="saveCompare()">比較画像を保存</button><button onclick="closeModal()">閉じる</button></div>
    <div class="row" style="margin:8px 0"><select class="grow" onchange="cmpSel[0]=this.value;drawCompare()">${opt(0)}</select><span>と</span>
    <select class="grow" onchange="cmpSel[1]=this.value;drawCompare()">${opt(1)}</select></div><div id="cmpgrid"></div>`);
  drawCompare();
}
async function drawCompare(){
  const src = cmpSources(); let h = `<div class="cmp"><div></div>${DIRS.map(([, l]) => `<div class="h">${l}</div>`).join('')}`;
  for (const k of cmpSel) { const s = src.find(x => x.key === k);
    h += `<div class="rl">${s.label}<br><small>${fmtDate(s.date)}</small></div>`;
    for (const [d] of DIRS) { const u = await s.url(d); h += `<div class="ph">${u ? photoTag(u) : '<span class="muted">なし</span>'}</div>`; } }
  $('#cmpgrid').innerHTML = h + '</div>';
}
async function saveCompare(){
  if (!confirm('比較画像を端末の「ダウンロード」に保存します。\nこの画像は暗号化されません。お客様への説明に使った後は削除してください。')) return;
  const src = cmpSources(), cw = 360, ch = 480, lh = 40, hh = 34, W = cw * 4, H = hh + cmpSel.length * (lh + ch);
  const c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, W, H); g.fillStyle = '#2b2523'; g.font = 'bold 22px sans-serif'; g.textAlign = 'center';
  DIRS.forEach(([, l], i) => g.fillText(l, cw * i + cw / 2, 25));
  const grid = !document.body.classList.contains('nogrid');
  for (let r = 0; r < cmpSel.length; r++) {
    const s = src.find(x => x.key === cmpSel[r]), y0 = hh + r * (lh + ch);
    g.fillStyle = '#8c5e5a'; g.fillRect(0, y0, W, lh); g.fillStyle = '#fff'; g.textAlign = 'left'; g.font = 'bold 20px sans-serif';
    g.fillText(`${s.label}　${fmtDate(s.date)}`, 12, y0 + 27);
    for (let i = 0; i < 4; i++) {
      const u = await s.url(DIRS[i][0]); if (!u) continue;
      const img = await new Promise(res => { const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = u; }); if (!img) continue;
      const sc = Math.min(cw / img.width, ch / img.height), w = img.width * sc, hgt = img.height * sc, x = cw * i + (cw - w) / 2, y = y0 + lh + (ch - hgt) / 2;
      g.drawImage(img, x, y, w, hgt);
      if (grid) { g.strokeStyle = 'rgba(0,190,255,.5)'; g.lineWidth = 1; g.beginPath();
        for (let k = 1; k < 10; k++) { g.moveTo(x + w * k / 10, y); g.lineTo(x + w * k / 10, y + hgt); g.moveTo(x, y + hgt * k / 10); g.lineTo(x + w, y + hgt * k / 10); }
        g.stroke(); g.strokeStyle = 'rgba(255,50,50,.85)'; g.lineWidth = 2; g.beginPath(); g.moveTo(x + w / 2, y); g.lineTo(x + w / 2, y + hgt); g.stroke(); }
    }
  }
  c.toBlob(b => { const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = `比較_${F.date}.jpg`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000); }, 'image/jpeg', 0.9);
}

/* ================= 設定 ================= */
function vSettings(){
  const c = S.cfg;
  return `<div class="card"><h2>基本設定</h2><div class="grid2"><label class="f">店舗名<input id="s_shop" value="${esc(c.shopName)}"></label>
    <label class="f">自動ロックまでの時間（分）<input id="s_lock" type="number" min="1" max="60" value="${c.lockMin}"></label></div>
    <p class="muted">カルテ入力中に自動ロックされた場合、入力内容は下書きとして保存され、PINを入れると元の画面に戻ります。</p></div>
  <div class="card"><h2>タグ（1行に1つ）</h2><p class="muted" style="margin-top:0">カルテで選ぶ「部位・所見・施術」の選択肢です。</p>
    <div class="grid2">${Object.entries(c.tags).map(([cat, ts]) => `<label class="f">${esc(cat)}<textarea class="s_tag" data-cat="${esc(cat)}" rows="8">${esc(ts.join('\n'))}</textarea></label>`).join('')}</div>
    <div class="row" style="margin-top:10px"><button class="primary" onclick="saveSettings()">基本設定とタグを保存</button></div></div>
  <div class="card"><h2>申し送り・セルフケアのルール</h2><p class="muted" style="margin-top:0">「このタグを選んだら → この申し送り／セルフケアを候補に出す」というあなたの判断基準です。最初の5件はサンプルなので、ご自身の考えに書き換えてください。</p>
    ${c.rules.map(r => `<div class="card" style="background:var(--chip)"><div class="row"><div class="grow"><b>${r.when.map(esc).join(' / ') || '（タグ未設定）'}</b> のとき ${r.memo ? `<small>${esc(r.memo)}</small>` : ''}
      <div>申し送り：${(r.handover || []).map(esc).join('、') || '-'}</div><div>セルフケア：${(r.selfcare || []).map(esc).join('、') || '-'}</div></div>
      <button onclick="editRule('${r.id}')">編集</button><button class="danger" onclick="delRule('${r.id}')">削除</button></div></div>`).join('')}
    <button onclick="editRule()">＋ ルール追加</button></div>
  <div class="card"><h2>バックアップ（USB保管用）</h2>
    <p>最後のバックアップ：<b>${S.lastBackup ? new Date(S.lastBackup).toLocaleString('ja-JP') : 'まだありません'}</b>　<small id="usage"></small></p>
    <p class="muted">データはこのタブレットの中だけに暗号化して保存されています。故障・紛失に備えて、週1回程度バックアップを書き出し、USBメモリに移して保管してください。バックアップファイルも暗号化されているので、開くには同じPINが必要です。</p>
    <div class="row"><button class="primary" onclick="exportBackup()">バックアップを書き出す</button>
    ${fileInput('バックアップから復元', `accept=".json,application/json" onchange="importBackup(this)"`)}</div></div>`;
}
async function showUsage(){ try { const e = await navigator.storage.estimate(); const el = $('#usage'); if (el) el.textContent = `（使用量 約${Math.round(e.usage / 1e6)}MB）`; } catch (e) {} }
async function saveSettings(){
  const c = S.cfg;
  c.shopName = $('#s_shop').value.trim() || c.shopName;
  c.lockMin = Math.max(1, Math.min(60, +$('#s_lock').value || 5));
  document.querySelectorAll('.s_tag').forEach(t => c.tags[t.dataset.cat] = [...new Set(lines(t.value))]);
  await dataPut('cfg', c); resetIdle(); toast('設定を保存しました'); render();
}
function editRule(id){
  const r = id ? S.cfg.rules.find(x => x.id === id) : {id:null, when:[], handover:[], selfcare:[], memo:''};
  const all = Object.values(S.cfg.tags).flat();
  openModal(`<h3 style="margin-top:0">${id ? 'ルールの編集' : 'ルールの追加'}</h3>
    <div class="sub">このタグのどれかを選んだとき</div>
    <div class="chips" id="r_when">${all.map(t => `<button class="chip ${r.when.includes(t) ? 'on' : ''}" data-t="${esc(t)}" onclick="this.classList.toggle('on')">${esc(t)}</button>`).join('')}</div>
    <div class="grid2"><label class="f">次回への申し送り（1行に1つ）<textarea id="r_ho" rows="5">${esc((r.handover || []).join('\n'))}</textarea></label>
    <label class="f">セルフケア（1行に1つ）<textarea id="r_sc" rows="5">${esc((r.selfcare || []).join('\n'))}</textarea></label></div>
    <label class="f">メモ（このルールの根拠など）<input id="r_memo" value="${esc(r.memo)}"></label>
    <div class="row" style="margin-top:12px"><button class="primary" onclick="saveRule('${id || ''}')">保存</button><button onclick="closeModal()">キャンセル</button></div>`);
}
async function saveRule(id){
  const r = {id:id || uid(), when:[...document.querySelectorAll('#r_when .chip.on')].map(b => b.dataset.t),
    handover:lines($('#r_ho').value), selfcare:lines($('#r_sc').value), memo:$('#r_memo').value.trim()};
  if (!r.when.length) return toast('タグを1つ以上選んでください');
  const i = S.cfg.rules.findIndex(x => x.id === id);
  if (i >= 0) S.cfg.rules[i] = r; else S.cfg.rules.push(r);
  await dataPut('cfg', S.cfg); closeModal(); toast('ルールを保存しました'); render();
}
async function delRule(id){
  if (!confirm('このルールを削除しますか？')) return;
  S.cfg.rules = S.cfg.rules.filter(x => x.id !== id); await dataPut('cfg', S.cfg); render();
}

/* ================= バックアップ ================= */
const b64 = u => { u = new Uint8Array(u); let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); };
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function exportBackup(){
  toast('書き出しています…');
  const chk = await metaGet('check');
  const parts = [JSON.stringify({app:APP_DB, ver:1, at:new Date().toISOString(), salt:b64(await metaGet('salt')), check:[b64(chk.iv), b64(chk.ct)]}).slice(0, -1) + ',"data":['];
  const keys = await tx('data', 'readonly', s => s.getAllKeys());
  for (let i = 0; i < keys.length; i++) {
    const r = await tx('data', 'readonly', s => s.get(keys[i]));
    parts.push((i ? ',' : '') + JSON.stringify([keys[i], b64(r.iv), b64(r.ct), r.type || null, r.bin ? 1 : 0]));
  }
  parts.push(']}');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(parts, {type:'application/json'}));
  a.download = `chodo-karte-backup-${today()}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  S.lastBackup = Date.now(); await metaSet('lastBackup', S.lastBackup);
  toast('「ダウンロード」に保存しました。USBメモリに移してください'); if (view.name === 'settings') render();
}
async function importBackup(inp){
  const f = inp.files[0]; inp.value = ''; if (!f) return;
  let o; try { o = JSON.parse(await f.text()); if (o.app !== APP_DB) throw 0; } catch (e) { return toast('このアプリのバックアップファイルではありません'); }
  if (!confirm(`${o.at.slice(0, 10)} のバックアップで、今のデータをすべて置き換えます。よろしいですか？\n（復元後は、バックアップ作成時のPINで開きます）`)) return;
  F = null;
  await tx('data', 'readwrite', s => s.clear());
  for (const [k, iv, ct, type, bin] of o.data) await tx('data', 'readwrite', s => s.put(Object.assign({iv:unb64(iv), ct:unb64(ct).buffer}, bin ? {type, bin:1} : {}), k));
  await metaSet('salt', unb64(o.salt)); await metaSet('check', {iv:unb64(o.check[0]), ct:unb64(o.check[1]).buffer});
  await metaSet('lastBackup', Date.parse(o.at));
  alert('復元しました。バックアップ作成時のPINで開いてください。'); lock();
}

/* ================= 起動 ================= */
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal' && !rec) closeModal(); });
window.addEventListener('beforeunload', e => { if (F && F.dirty) { e.preventDefault(); e.returnValue = ''; } });
(async () => {
  if (!window.crypto?.subtle || !window.indexedDB) { $('#app').innerHTML = '<p style="padding:20px">このブラウザでは使えません。Chromeで https のアドレスから開いてください。</p>'; return; }
  DB = await openDB(); renderLock();
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
